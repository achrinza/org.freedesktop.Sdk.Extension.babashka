# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/refs/heads/main/data/flatpak-manifest.schema.json
id: org.freedesktop.Sdk.Extension.babashka
branch: '23.08'
runtime: org.freedesktop.Sdk
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.leiningen
build-extension: true
separate-locales: false
appstream-compose: false
modules:
  - name: graalvm23
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-23.0.1/graalvm-community-jdk-23.0.1_linux-x64_bin.tar.gz
        sha256: e26a0a74064b1689c056b5f24d7cc3b271f57f576be063b139d27aafa1322951
    build-commands:
      - mkdir -p "$FLATPAK_DEST/lib"
      - cp -ar . "$FLATPAK_DEST/lib/graalvm23"
  - name: babashka
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/babashka/babashka.git
        tag: v1.12.195
        commit: cd362fbf014f9df7fab8b38cf0c3e191e5f45ad4
    build-options:
      append-path: /usr/lib/sdk/babashka/lib/graalvm23:/usr/lib/sdk/leiningen/bin
      env:
        GRAALVM_HOME: /usr/lib/sdk/babashka/lib/graalvm23
      build-args:
        - --share=network
    build-commands:
      - ./script/uberjar
      - ./script/compile
      - install -Dm755 bb "$FLATPAK_DEST/bin/bb"
    cleanup:
      - lib/graalvm23
  - name: scripts
    buildsystem: simple
    sources:
      - type: script
        commands:
          - export PATH="$PATH:/usr/lib/sdk/babashka/bin"
        dest-filename: enable.sh
    build-commands:
      - install -Dm755 enable.sh "${FLATPAK_DEST}/enable.sh"
